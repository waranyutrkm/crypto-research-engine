name: Daily cashflow research
on:
  push:
    branches: [research/daily-cashflow-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python research/daily_cashflow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cashflow-results
          path: results/
